<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kings&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<title>The Tavern Ledger — Oakhurst West Marches</title>
</head>
<body>

  <!-- Hand-drawn border filters: a straight CSS border reads as printed, so
       every bordered element instead uses one of these turbulence+displacement
       filters for a slight, consistent ink wobble (three variants for variety). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="inkWobble1" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="1" seed="3" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
      <filter id="inkWobble2" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="1" seed="11" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
      <filter id="inkWobble3" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.012" numOctaves="1" seed="19" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
    </defs>
  </svg>

  <section class="scene scene--landing" id="landing">
    <img class="landing-img" id="landingImg" src="docs/AI_Artwork/LandingPage.png" alt="The Oakhurst tavern: a bartender behind the counter and an open book on the bar" />
    <svg class="hotspots" id="landingHotspots" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div class="hotspot-label" id="hotspotLabel"></div>
    <p class="landing-caption">Ask the barkeep about the rules, or open the ledger to roll up an adventurer.</p>
  </section>

  <div class="modal" id="rulesModal" hidden>
    <div class="modal-backdrop" id="rulesBackdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
      <button class="modal-close" id="rulesClose" aria-label="Close">&times;</button>
      <div class="modal-body" id="rulesBody"></div>
    </div>
  </div>

  <section class="scene scene--book" id="bookScene" hidden>
    <img class="book-bg" id="bookBg" src="docs/AI_Artwork/CharacterGeneratorHeadon.png" alt="An open, blank ledger book" />
    <button class="back-btn" id="backBtn" type="button">&#8249; Back</button>

    <div class="book-overlay" id="bookOverlay">
      <div class="page-flap" id="pageFlap"></div>

      <div class="spread spread--player" id="spreadPlayer">
        <div class="spread-heading">
          <p class="spread-eyebrow">West Marches &middot; Tales from the Frontier</p>
          <h1 class="spread-title">Choose Your Player</h1>
        </div>
        <div class="ledger-list" id="playerList"></div>
        <form class="ledger-add-form" id="addPlayerForm">
          <input class="ledger-add-input hand-border" id="addPlayerInput" type="text" placeholder="New adventurer's player" maxlength="24" />
          <button class="ledger-add-btn hand-border hand-border--b" type="submit">+ Add to the ledger</button>
        </form>
      </div>

      <div class="spread spread--generate" id="spreadGenerate" hidden>
        <button class="gen-field gen-roll" id="rollBtn" type="button" aria-label="Click to roll your fate">
          <img class="gen-roll-art" src="docs/AI_Artwork/StylizedD20.png?v=3" alt="" />
          <span class="gen-roll-hint">Click to roll<br />your fate</span>
        </button>

        <div class="gen-field gen-name-box">
          <span class="gen-label">Adventurer Name</span>
          <input class="gen-value gen-value--script gen-name-input" id="nameInput" type="text" placeholder="&hellip;" maxlength="60" />
        </div>

        <div class="gen-field gen-combat manuscript-frame hand-border" id="derivedBlock">
          <img class="corner-flourish corner-flourish--tl" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <img class="corner-flourish corner-flourish--tr" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <img class="corner-flourish corner-flourish--bl" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <img class="corner-flourish corner-flourish--br" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <p class="gen-manuscript-title">Combat Statistics</p>
          <div class="gen-manuscript-rule" aria-hidden="true"></div>
          <div class="gen-manuscript-row">
            <div class="gen-manuscript-item"><span class="gen-label">AC</span><span class="gen-value" id="derivedAc"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Init</span><span class="gen-value" id="derivedInit"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Speed</span><span class="gen-value" id="derivedSpeed"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">BAB</span><span class="gen-value" id="derivedBab"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Fort</span><span class="gen-value" id="derivedFort"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Ref</span><span class="gen-value" id="derivedRef"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Will</span><span class="gen-value" id="derivedWill"></span></div>
          </div>
        </div>

        <div class="gen-field gen-portrait" id="portraitFrame">
          <img id="portraitImg" alt="" />
        </div>

        <div class="gen-field gen-hp-box">
          <span class="gen-label">HP</span>
          <span class="gen-value" id="hpField"></span>
          <span class="gen-sublabel" id="hdField"></span>
        </div>

        <div class="gen-field gen-identity gen-manuscript-row" id="identityBlock">
          <div class="gen-manuscript-item"><span class="gen-label">Race</span><span class="gen-value gen-value--script" id="raceField"></span></div>
          <div class="gen-manuscript-item"><span class="gen-label">Class</span><span class="gen-value gen-value--script" id="classField"></span></div>
        </div>

        <div class="gen-field gen-abilities manuscript-frame hand-border" id="abilityBlock">
          <img class="corner-flourish corner-flourish--tl" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <img class="corner-flourish corner-flourish--tr" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <img class="corner-flourish corner-flourish--bl" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <img class="corner-flourish corner-flourish--br" src="docs/AI_Artwork/dnd_quill_ornaments/corner-flourish.webp" alt="" aria-hidden="true" />
          <p class="gen-manuscript-title">Ability Scores</p>
          <div class="gen-manuscript-rule" aria-hidden="true"></div>
          <div class="gen-manuscript-row">
            <div class="gen-manuscript-item"><span class="gen-label">Str</span><span class="gen-value" id="statStr"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Dex</span><span class="gen-value" id="statDex"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Con</span><span class="gen-value" id="statCon"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Int</span><span class="gen-value" id="statInt"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Wis</span><span class="gen-value" id="statWis"></span></div>
            <div class="gen-manuscript-item"><span class="gen-label">Cha</span><span class="gen-value" id="statCha"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="gen-status-strip" id="genStatusStrip" hidden>
      <p class="gen-summary" id="generateFor">Rolling for &hellip;</p>
      <div class="unlock-summary" id="unlockSummaryGen"></div>
    </div>

    <div class="gen-controls" id="genControls" hidden>
      <div class="gen-controls-row">
        <button class="ink-btn hand-border" id="rerollBtn" type="button">Reroll</button>
        <button class="ink-btn hand-border hand-border--b" id="exportBtn" type="button">Export to Fantasy Grounds</button>
        <button class="ink-btn ink-btn--ghost hand-border hand-border--c" id="copyBtn" type="button">Copy XML instead</button>
      </div>
      <p class="roll-log" id="rollLog"></p>
      <p class="status-line" id="statusLine"></p>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
