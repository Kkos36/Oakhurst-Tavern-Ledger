<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<title>The Tavern Ledger — Oakhurst West Marches</title>
</head>
<body>

  <!-- Hand-drawn border filters: a straight CSS border reads as printed, so
       every bordered element instead uses one of these turbulence+displacement
       filters for a slight, consistent ink wobble (three variants for variety). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="inkWobble1" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.035" numOctaves="2" seed="3" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
      <filter id="inkWobble2" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="11" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
      <filter id="inkWobble3" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.04" numOctaves="2" seed="19" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
    </defs>
  </svg>

  <section class="scene scene--landing" id="landing">
    <img class="landing-img" id="landingImg" src="docs/AI_Artwork/LandingPage.png" alt="The Oakhurst tavern: a bartender behind the counter and an open book on the bar" />
    <svg class="hotspots" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <polygon id="hotspotBartender" class="hotspot" role="button" tabindex="0" aria-label="Ask the bartender about the rules"
        points="742,93 661,100 613,200 598,316 597,432 609,538 637,643 911,643 900,538 921,432 908,316 872,200 819,100"></polygon>
      <polygon id="hotspotBook" class="hotspot" role="button" tabindex="0" aria-label="Open the ledger to roll a character"
        points="411,662 548,648 742,640 979,653 1084,689 1074,863 1042,940 442,940 369,875 347,717"></polygon>
    </svg>
    <div class="hotspot-label" id="hotspotLabel"></div>
    <p class="landing-caption">Ask the barkeep about the rules, or open the ledger to roll up an adventurer.</p>
  </section>

  <div class="modal" id="rulesModal" hidden>
    <div class="modal-backdrop" id="rulesBackdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
      <button class="modal-close" id="rulesClose" aria-label="Close">&times;</button>
      <div class="modal-body" id="rulesBody"></div>
    </div>
  </div>

  <section class="scene scene--book" id="bookScene" hidden>
    <img class="book-bg" id="bookBg" src="docs/AI_Artwork/CharacterGeneratorHeadon.png" alt="An open, blank ledger book" />
    <button class="back-btn" id="backBtn" type="button">&#8249; Back</button>

    <div class="book-overlay" id="bookOverlay">
      <div class="page-flap" id="pageFlap"></div>

      <div class="spread spread--player" id="spreadPlayer">
        <div class="spread-heading">
          <p class="spread-eyebrow">West Marches &middot; Tales from the Frontier</p>
          <h1 class="spread-title">Choose Your Player</h1>
        </div>
        <div class="ledger-list" id="playerList"></div>
        <form class="ledger-add-form" id="addPlayerForm">
          <input class="ledger-add-input hand-border" id="addPlayerInput" type="text" placeholder="New adventurer's player" maxlength="24" />
          <button class="ledger-add-btn hand-border hand-border--b" type="submit">+ Add to the ledger</button>
        </form>
      </div>

      <div class="spread spread--generate" id="spreadGenerate" hidden>
        <button class="gen-field gen-roll" id="rollBtn" type="button" aria-label="Click to roll your fate">
          <svg class="gen-roll-d20" viewBox="0 0 220 200" aria-hidden="true">
            <polygon points="110,8 206,58 206,142 110,192 14,142 14,58"></polygon>
            <polyline points="14,58 110,95 206,58"></polyline>
            <polyline points="14,142 110,95 206,142"></polyline>
            <polyline points="110,8 110,95"></polyline>
            <polyline points="110,95 110,192"></polyline>
          </svg>
          <span class="gen-roll-hint">Click to roll<br />your fate</span>
        </button>

        <div class="gen-field gen-name-box hand-border">
          <span class="gen-label">Adventurer Name</span>
          <input class="gen-value gen-value--script gen-name-input" id="nameInput" type="text" placeholder="&hellip;" maxlength="60" />
        </div>

        <div class="gen-field gen-derived" id="derivedBlock">
          <div class="gen-derived-item hand-border hand-border--b"><span class="gen-label">AC</span><span class="gen-value" id="derivedAc"></span></div>
          <div class="gen-derived-item hand-border hand-border--c"><span class="gen-label">Init</span><span class="gen-value" id="derivedInit"></span></div>
          <div class="gen-derived-item hand-border"><span class="gen-label">Speed</span><span class="gen-value" id="derivedSpeed"></span></div>
          <div class="gen-derived-item hand-border hand-border--b"><span class="gen-label">BAB</span><span class="gen-value" id="derivedBab"></span></div>
          <div class="gen-derived-item hand-border hand-border--c"><span class="gen-label">Fort</span><span class="gen-value" id="derivedFort"></span></div>
          <div class="gen-derived-item hand-border"><span class="gen-label">Ref</span><span class="gen-value" id="derivedRef"></span></div>
          <div class="gen-derived-item hand-border hand-border--b"><span class="gen-label">Will</span><span class="gen-value" id="derivedWill"></span></div>
        </div>

        <div class="gen-field gen-portrait" id="portraitFrame"><img id="portraitImg" alt="" /></div>

        <div class="gen-field gen-hp-box hand-border hand-border--c">
          <span class="gen-label">HP</span>
          <span class="gen-value" id="hpField"></span>
          <span class="gen-sublabel" id="hdField"></span>
        </div>

        <div class="gen-field gen-race-box hand-border">
          <span class="gen-label">Race</span>
          <span class="gen-value gen-value--script" id="raceField"></span>
        </div>
        <div class="gen-field gen-class-box hand-border hand-border--b">
          <span class="gen-label">Class</span>
          <span class="gen-value gen-value--script" id="classField"></span>
        </div>

        <div class="gen-field gen-stat gen-str hand-border"><span class="gen-label">Str</span><span class="gen-value" id="statStr"></span></div>
        <div class="gen-field gen-stat gen-dex hand-border hand-border--b"><span class="gen-label">Dex</span><span class="gen-value" id="statDex"></span></div>
        <div class="gen-field gen-stat gen-con hand-border hand-border--c"><span class="gen-label">Con</span><span class="gen-value" id="statCon"></span></div>
        <div class="gen-field gen-stat gen-stat--sm gen-int hand-border hand-border--b"><span class="gen-label">Int</span><span class="gen-value" id="statInt"></span></div>
        <div class="gen-field gen-stat gen-stat--sm gen-wis hand-border hand-border--c"><span class="gen-label">Wis</span><span class="gen-value" id="statWis"></span></div>
        <div class="gen-field gen-stat gen-stat--sm gen-cha hand-border"><span class="gen-label">Cha</span><span class="gen-value" id="statCha"></span></div>
      </div>
    </div>

    <div class="gen-status-strip" id="genStatusStrip" hidden>
      <p class="gen-summary" id="generateFor">Rolling for &hellip;</p>
      <div class="unlock-summary" id="unlockSummaryGen"></div>
    </div>

    <div class="gen-controls" id="genControls" hidden>
      <div class="gen-controls-row">
        <button class="ink-btn hand-border" id="rerollBtn" type="button">Reroll</button>
        <button class="ink-btn hand-border hand-border--b" id="exportBtn" type="button">Export to Fantasy Grounds</button>
        <button class="ink-btn ink-btn--ghost hand-border hand-border--c" id="copyBtn" type="button">Copy XML instead</button>
      </div>
      <p class="roll-log" id="rollLog"></p>
      <p class="status-line" id="statusLine"></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
